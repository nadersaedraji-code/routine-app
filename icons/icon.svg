      <stop stop-color="#16483C"/><stop offset=".55" stop-color="#0E3129"/><stop offset="1" stop-color="#071D1B"/>
    </linearGradient>
    <radialGradient id="bloom" cx="320" cy="187" r="247" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3C8D71" stop-opacity=".61"/><stop offset=".6" stop-color="#267557" stop-opacity=".17"/><stop offset="1" stop-color="#153926" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foil" x1="148" y1="312" x2="327" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#126954"/><stop offset=".26" stop-color="#55B896"/><stop offset=".54" stop-color="#AADEC4"/><stop offset=".74" stop-color="#F8EBC0"/><stop offset=".92" stop-color="#EED08D"/><stop offset="1" stop-color="#A87240"/>
    </linearGradient>
    <linearGradient id="lower" x1="147" y1="367" x2="379" y2="259" gradientUnits="userSpaceOnUse">
      <stop stop-color="#124A40"/><stop offset=".24" stop-color="#238A6F"/><stop offset=".57" stop-color="#70C4A1"/><stop offset=".82" stop-color="#D9E5B3"/><stop offset="1" stop-color="#FFF1C5"/>
    </linearGradient>
    <linearGradient id="edge" x1="145" y1="388" x2="386" y2="295" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D483D"/><stop offset=".51" stop-color="#1E765B"/><stop offset=".82" stop-color="#6BA787"/><stop offset="1" stop-color="#2B6151"/>
    </linearGradient>
    <linearGradient id="return" x1="216" y1="257" x2="370" y2="137" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B6751"/><stop offset=".48" stop-color="#69AF90"/><stop offset="1" stop-color="#F2CE8D"/>
    </linearGradient>
    <linearGradient id="glint" x1="142" y1="389" x2="347" y2="137" gradientUnits="userSpaceOnUse">
      <stop stop-color="#468F73" stop-opacity="0"/><stop offset=".5" stop-color="#C8F7DD" stop-opacity=".85"/><stop offset=".94" stop-color="#FFF2C6" stop-opacity=".8"/><stop offset="1" stop-color="#FFF2C6" stop-opacity="0"/>
    </linearGradient>
    <path id="upper-loop" fill-rule="evenodd" d="M134 347c14-29 30-65 46-105 18-47 40-91 78-117 39-27 91-27 114 7 21 31 5 70-29 96-43 32-108 35-152 76-13 13-25 29-36 48z M218 247c27-15 68-20 96-40 27-19 38-42 24-55-14-14-43-9-66 8-23 18-39 50-54 87z"/>
    <path id="lower-loop" fill-rule="evenodd" d="M136 349c20-39 49-76 96-98 63-29 129-31 153 8 29 46-17 103-75 130-59 28-118 29-146-3-10-12-16-24-16-38l22-24c4 23 23 40 47 45 28 7 59-2 85-18 32-19 56-48 44-64-13-18-45-17-81-3-43 17-74 47-108 96z"/>
  </defs>
  <g clip-path="url(#tile)">
