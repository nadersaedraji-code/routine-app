<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Better">
  <title>Better — The Upward Fold</title>
  <desc>Two ascending loops of folded emerald and champagne metal form an abstract B.</desc>
  <defs>
