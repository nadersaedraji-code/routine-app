    <use href="#lower-loop" fill="#061914" transform="translate(2 8)" opacity=".8"/>
    <use href="#upper-loop" fill="url(#foil)"/>
    <path d="M218 247c27-15 68-20 96-40 27-19 38-42 24-55l12 7c18 18-2 47-34 65-34 20-74 25-106 46z" fill="url(#return)"/>
    <use href="#lower-loop" fill="url(#lower)"/>
    <path d="M385 259c29 46-17 103-75 130-59 28-118 29-146-3-10-12-16-24-16-38l9-8c3 16 9 26 19 35 25 24 79 21 131-3 56-25 91-76 78-113z" fill="url(#edge)"/>
    <path d="M157 373c31-45 67-77 112-94 35-13 67-13 80 4M152 342c16-30 32-69 46-104 22-57 48-91 81-108 32-16 58-13 76-3" fill="none" stroke="url(#glint)" stroke-width="2" stroke-linecap="round"/>
